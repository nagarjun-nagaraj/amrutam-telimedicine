name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: amrutam_user
          POSTGRES_PASSWORD: amrutam_pass
          POSTGRES_DB: amrutam_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://amrutam_user:amrutam_pass@localhost:5432/amrutam_test_db
      SYNC_DATABASE_URL: postgresql://amrutam_user:amrutam_pass@localhost:5432/amrutam_test_db
      SECRET_KEY: test-secret-key-for-ci-minimum-32-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      REDIS_URL: redis://localhost:6379/0
      MFA_ISSUER: AmrutamTelemedicine
      BCRYPT_ROUNDS: 4
      RATE_LIMIT_PER_MINUTE: 60
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      APP_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install greenlet
        run: pip install greenlet

      - name: Run database migrations
        run: alembic upgrade head
        env:
          SYNC_DATABASE_URL: postgresql://amrutam_user:amrutam_pass@localhost:5432/amrutam_test_db

      - name: Run tests
        run: pytest tests/unit/test_auth.py -v --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false