version: '3.9'

services:
  api:
    build: .
    container_name: amrutam_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://amrutam_user:amrutam_pass@db:5432/amrutam_db
      - SYNC_DATABASE_URL=postgresql://amrutam_user:amrutam_pass@db:5432/amrutam_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-super-secret-key-change-in-production-min-32-chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - MFA_ISSUER=AmrutamTelemedicine
      - BCRYPT_ROUNDS=12
      - RATE_LIMIT_PER_MINUTE=60
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000"]
      - APP_ENV=production
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - amrutam_network

  db:
    image: postgres:16-alpine
    container_name: amrutam_db
    environment:
      - POSTGRES_USER=amrutam_user
      - POSTGRES_PASSWORD=amrutam_pass
      - POSTGRES_DB=amrutam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam_user -d amrutam_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - amrutam_network

  redis:
    image: redis:7-alpine
    container_name: amrutam_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - amrutam_network

  prometheus:
    image: prom/prometheus:latest
    container_name: amrutam_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - amrutam_network

  grafana:
    image: grafana/grafana:latest
    container_name: amrutam_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - amrutam_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  amrutam_network:
    driver: bridge